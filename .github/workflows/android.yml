# Build the Android APK (debug) — no Play Store, sideload only.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android project
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: ./gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaung-love-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
