# Build the Android APK (debug) — no Play Store, sideload only.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android project
        run: |         
          mkdir -p out
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          # Voice messages need the mic. The manifest is regenerated by
          # `cap add` on some runs, so declare RECORD_AUDIO here after
          # every sync (same reason as the google-services copy above).
          # The app asks for the permission on first record; without this
          # line the system dialog can never grant it.
          if ! grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|    <uses-permission android:name="android.permission.INTERNET" />|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' android/app/src/main/AndroidManifest.xml
          fi
      - name: Generate app icons
        run: npx @capacitor/assets generate
      - name: Restore stable debug keystore
        run: |
          mkdir -p ~/.android
          cp keystore-debug.keystore ~/.android/debug.keystore
      - name: Bump versionCode
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaung-love-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
